<script type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Global Internship Program - Full Stack","description":"\u003cp\u003e\u003cem\u003eHENNGE is tentatively scheduled to relocate our Tokyo headquarters from Shibuya to Shinjuku in April 2027. All the batches opened for application will take place at our brand-new Shinjuku office.\u003c/em\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003eHENNGE’s Global Internship Program (GIP)\u003c/strong\u003e is an on-site software engineering training program designed and run by HENNGE, a cloud security company based in Tokyo. The program is created for students and early-career engineers who want to strengthen their \u003cstrong\u003efull-stack engineering skills\u003c/strong\u003e in a global, English-speaking environment at our Tokyo headquarters.\u003c/p\u003e\n\n\u003cp\u003eThis \u003cstrong\u003eFull-Stack Pathway\u003c/strong\u003e focuses on hands-on application development training across \u003cstrong\u003eback-end, front-end, and basic DevOps\u003c/strong\u003e, using \u003cstrong\u003ePython (non-ML stack), Go, or TypeScript\u003c/strong\u003e on the back-end and \u003cstrong\u003eTypeScript with modern front-end frameworks\u003c/strong\u003e on the front-end. The program emphasizes fundamental engineering skills, problem-solving, explanation, and collaboration, rather than production work.\u003c/p\u003e\n\n\u003cp\u003eJapanese is \u003cstrong\u003enot required.\u003c/strong\u003e\u003c/p\u003e\n\n\u003ch3\u003eWhat You’ll Learn \u0026amp; Practice\u003c/h3\u003e\n\n\u003cp\u003eDuring the program, you will:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003eDevelop \u003cstrong\u003efull-stack web applications\u003c/strong\u003e as part of structured training projects\u003c/li\u003e\n  \u003cli\u003eBuild and connect \u003cstrong\u003eback-end APIs and services\u003c/strong\u003e with front-end applications\u003c/li\u003e\n  \u003cli\u003ePractice key full-stack engineering concepts, including:\n    \u003cul\u003e\n      \u003cli\u003eBack-end logic and API design\u003c/li\u003e\n      \u003cli\u003eFront-end state management and data flow\u003c/li\u003e\n      \u003cli\u003eAuthentication and security basics\u003c/li\u003e\n      \u003cli\u003eSoftware testing (unit, integration, end-to-end)\u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/li\u003e\n  \u003cli\u003eLearn, at a practical level, how \u003cstrong\u003efront-end, back-end, and cloud infrastructure interact\u003c/strong\u003e\n\u003c/li\u003e\n  \u003cli\u003eWork with \u003cstrong\u003eUnix-like environments\u003c/strong\u003e and basic DevOps tooling\u003c/li\u003e\n  \u003cli\u003eExplain your technical decisions, trade-offs, and problem-solving approach during discussions and reviews\u003c/li\u003e\n  \u003cli\u003eReceive feedback from mentors and iteratively improve your implementation\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eProgram Structure\u003c/h3\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\n\u003cstrong\u003eWeeks 1-4:\u003c/strong\u003e Full-Stack Application Development Project\u003c/li\u003e\n  \u003cli\u003e\n\u003cstrong\u003eWeek 5:\u003c/strong\u003e DevOps \u0026amp; Infrastructure Project\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eInternship Details\u003c/h3\u003e\n\n\u003cul\u003e\n  \u003cli\u003eOn-site program at HENNGE’s headquarters in Tokyo (Mon–Fri, 10:00–19:00 JST)\u003c/li\u003e\n  \u003cli\u003eMentorship and technical discussions with engineers based in the same office\u003c/li\u003e\n  \u003cli\u003eEnglish is the primary language used throughout the program\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e* This program is \u003cstrong\u003enot remote\u003c/strong\u003e. Participants are expected to attend on-site.\u003c/p\u003e\n\n\u003ch3\u003eBenefits \u003c/h3\u003e\n\n\u003cul\u003e\n  \u003cli\u003eRound-trip airfares from and back to your country of residence\u003c/li\u003e\n  \u003cli\u003ePre-arrival support and visa guidance\u003c/li\u003e\n  \u003cli\u003eMedical insurance* and a phone with mobile data will be provided during your internship in Tokyo, Japan**\u003c/li\u003e\n  \u003cli\u003eUp to 150,000 JPY of monthly subsidy to cover accommodation, meals, transportation, and networking activities\u003c/li\u003e\n  \u003cli\u003eSubsidized company events on top of monthly subsidy (Monthly Technical Sessions, Board Game Night, Get-to-know-you Lunches, and many others!) to get to know teams across divisions\u003c/li\u003e\n  \u003cli\u003eAccess to online learning platform during the internship period\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cem\u003e* Medical insurance will only be provided to interns who do not reside in Japan\u003c/em\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cem\u003e** This internship is an unpaid training program with a subsidy provided to all interns\u003c/em\u003e\u003c/p\u003e\n\n\u003ch3\u003eInternship schedule (as of October 2)\u003c/h3\u003e\n\n\u003cul\u003e\n  \u003cli\u003eBatch 2 (2027): Jun 1 - Jul 16 (7 weeks)\u003c/li\u003e\n  \u003cli\u003eBatch 3 (2027): Aug 2 - Sep 3 (5 weeks)\u003c/li\u003e\n  \u003cli\u003eBatch 4 (2027): Oct 1 - Oct 29 (5 weeks)\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3\u003eOur Stance on AI and Software Engineering\u003c/h3\u003e\n\n\u003cp\u003eAI tools can be helpful, but the goal of HENNGE’s Global Internship Program (GIP) is to help you build strong software engineering fundamentals.\u003c/p\u003e\n\n\u003cp\u003eTo support that learning, we ask you not to use AI tools to generate code for training assignments or solution implementations. The code you submit should be written by you and reflect your own understanding.\u003c/p\u003e\n\n\u003cp\u003eYou may use a designated AI service to support your learning in non-code-generating ways, such as clarifying technical concepts, understanding documentation, or helping with non-essential tasks (for example, command-line options).\u003c/p\u003e\n\n\u003cp\u003eThroughout the program, you’ll be expected to take ownership of your code and clearly explain your thinking, trade-offs, and design decisions. In this learning environment, you are the engineer and the final gatekeeper of quality.\u003c/p\u003e\n\u003ch3\u003eRequirements\u003c/h3\u003e\u003cul\u003e\n  \u003cli\u003eThird-year undergraduate or higher (including Master’s and Doctoral students). Recent graduates are welcome to apply\u003c/li\u003e\n  \u003cli\u003ePursuing or holding a degree in Computer Science or a related field. If not, equivalent experience from a tech internship or bootcamp is expected\u003c/li\u003e\n  \u003cli\u003eFluency in English (Japanese not required)\u003c/li\u003e\n  \u003cli\u003eProficiency in Python, Go, or React/Vue in TypeScript\u003c/li\u003e\n  \u003cli\u003eKnowledge of Linux / MacOS / Unix-like environments\u003c/li\u003e\n  \u003cli\u003eInterested in open source or tech community activities\u003c/li\u003e\n  \u003cli\u003eInterested in pursuing a career in Japan\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003cstrong\u003eAt least meet three of the following:\u003c/strong\u003e\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003eExperience in cloud computing platforms, especially AWS\u003c/li\u003e\n  \u003cli\u003eExperience in full stack web application development\u003c/li\u003e\n  \u003cli\u003eKnowledge of distributed systems\u003c/li\u003e\n  \u003cli\u003eKnowledge of DevOps tools and practices (CI/CD, Infrastructure as Code)\u003c/li\u003e\n  \u003cli\u003eKnowledge of Container technology (e.g. Docker)\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003e\u003ca href=\"https://stackshare.io/hennge/hennge-global-internship-program\"\u003eMore details about the technology stack for this internship program:\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003eNice to haves\u003c/h3\u003e\u003cp\u003e\u003cem\u003eWhile not specifically required, tell us if you have any of the following.\u003c/em\u003e\u003c/p\u003e\u003cp\u003eOur ideal full stack engineering intern is a curious problem-solver who’s excited to build real-world applications and grow in a fast-paced tech environment. We’re especially interested in candidates who:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003eAre proficient in Python, Go, and React/Vue in TypeScript\u003c/li\u003e\n  \u003cli\u003eAre comfortable working in \u003cstrong\u003eUnix-like environments\u003c/strong\u003e\n\u003c/li\u003e\n  \u003cli\u003eHave a solid grasp of both front-end and back-end development\u003c/li\u003e\n  \u003cli\u003eHave an interest in cloud computing and DevOps practices\u003c/li\u003e\n  \u003cli\u003eAre passionate about learning, contributing to tech communities, and possibly pursuing a career in Japan\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eBring your curiosity, versatility, and drive—we’re excited to see what you can build with us.\u003c/p\u003e\n","datePosted":"2024-10-24T17:03:02.778+09:00","hiringOrganization":{"@type":"Organization","name":"HENNGE","sameAs":"https://www.tokyodev.com/companies/hennge","logo":"https://assets.tokyodev.com/tokyodev-production-r2/variants/5p7l3i9ofhkq8m4mujsh1h47xcmq/a2949cfcd894c379bb9f2eb83be1c3307609ebc2459ea99a6837f1ce4543439b"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Shibuya-ku","addressRegion":"Tokyo","addressCountry":"JP"}},"employmentType":"INTERN"}</script>
