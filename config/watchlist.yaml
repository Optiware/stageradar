# Entreprises cibles dont le site carrière expose une API publique (§3.2).
#
# Chaque entrée a été testée : l'API répond et liste des postes techniques dans les pays indiqués
# à la date `verifie_le`. Aucune entrée n'est ajoutée « de mémoire » : passer par
#   npm run detect-ats -- <url-carrière>
# qui interroge l'API et propose l'entrée à coller ici.
#
# `pays` : pays visés où l'entreprise recrute (information ; le collecteur lit toutes les annonces
# et ne garde que les stages situés dans les pays du profil).
# `pays_defaut` : pays retenu quand le lieu d'une annonce ne nomme ni pays ni ville connue.

