# StageRadar sur un VPS : le strict nécessaire de Supabase auto-hébergé
# (Postgres, authentification, API REST), plus un petit service propre à l'application. Le front et le HTTPS sont servis par le nginx de l'hôte.
#
# Versions et variables reprises de la composition officielle :
# https://github.com/supabase/supabase/blob/master/docker/docker-compose.yml
# Kong / Envoy n'est pas repris : nginx route /auth/v1 et /rest/v1 directement, et les
# autorisations reposent sur le jeton (PostgREST, GoTrue) et sur la RLS, pas sur la passerelle.
#
# Aucun port n'est ouvert sur Internet : l'API n'écoute que sur 127.0.0.1, Postgres sur rien.
name: stageradar

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      # Donne leur mot de passe aux rôles de connexion (doit tourner en super-utilisateur).
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - db-data:/var/lib/postgresql/data
      # Clé de déchiffrement de pgsodium, à conserver entre deux redémarrages.
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PORT_AUTH:-54331}:9999'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${SITE_URL}
      # Le seul compte est créé par installer.sh : personne ne peut s'inscrire.
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_PASSWORD_MIN_LENGTH: 12

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SITE_URL}

      # Facultatif : sans serveur d'envoi, aucun e-mail ne part (connexion par mot de passe).
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: StageRadar
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PORT_REST:-54332}:3000'
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      # La description du schéma n'a pas à être publique.
      PGRST_OPENAPI_MODE: disabled

  # Collecte des offres : lancée par cron (collecter.sh), jamais par `docker compose up`.
  collecteur:
    image: node:22-alpine
    profiles: ['collecte']
    mem_limit: 512m
    user: node
    depends_on:
      rest:
        condition: service_started
    volumes:
      # collect.mjs (collecteur empaqueté en un fichier) et watchlist.yaml, copiés par deployer.mjs.
      - ./collecteur:/app:ro
    working_dir: /app
    environment:
      SUPABASE_URL: http://rest:3000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      STAGERADAR_WATCHLIST: /app/watchlist.yaml
    command: ['node', 'collect.mjs']

  # Service appelé par l'application : import d'une offre par son adresse, collecte à la demande.
  # Il n'écoute que sur le serveur (nginx lui transmet /api/) et ne répond qu'au propriétaire.
  api:
    image: node:22-alpine
    restart: unless-stopped
    mem_limit: 384m
    user: node
    depends_on:
      rest:
        condition: service_started
    ports:
      - '127.0.0.1:${PORT_API:-54333}:3000'
    volumes:
      # api.mjs (service empaqueté en un fichier) et watchlist.yaml, copiés par deployer.mjs.
      - ./collecteur:/app:ro
    working_dir: /app
    environment:
      PORT: 3000
      SUPABASE_URL: http://rest:3000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      STAGERADAR_WATCHLIST: /app/watchlist.yaml
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/sante']
      interval: 5s
      timeout: 5s
      retries: 6
    command: ['node', 'api.mjs']

volumes:
  db-data:
  db-config:
